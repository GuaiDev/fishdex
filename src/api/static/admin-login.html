<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FishBot — Admin Login</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #17140F; color: #E8E2D4; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  .card { width: 100%; max-width: 340px; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { font-size: 13px; color: #9C9585; margin: 0 0 20px; }
  input[type="password"] {
    width: 100%; box-sizing: border-box; padding: 12px 14px; margin-bottom: 10px;
    background: #221E17; border: 1px solid #3A3529; border-radius: 8px;
    color: #E8E2D4; font-size: 14px; outline: none;
  }
  label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #9C9585; margin-bottom: 16px; }
  button {
    width: 100%; padding: 12px; border: none; border-radius: 999px;
    background: #5C7A52; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { background: #3A3529; cursor: default; }
  #status { margin-top: 12px; font-size: 12px; }
  #status.error { color: #C97064; }
  #status.ok { color: #7FA36F; }
  #forget { background: none; border: none; color: #9C9585; font-size: 11px; text-decoration: underline; cursor: pointer; padding: 0; margin-top: 12px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Admin login</h1>
    <p>Personal shortcut — fetches a fresh session token via <code>/admin/token</code>. Not for sharing; whoever holds the API key gets full admin access.</p>
    <form id="form">
      <input type="password" id="apiKey" placeholder="FISHBOT_API_KEY" autocomplete="off" required />
      <label><input type="checkbox" id="remember" checked /> Remember on this device</label>
      <button type="submit" id="submitBtn">Log in</button>
    </form>
    <div id="status"></div>
    <button id="forget" type="button" style="display:none">Forget saved key on this device</button>
  </div>

  <script>
    const KEY_STORAGE = 'fishbot_admin_key';
    const form = document.getElementById('form');
    const apiKeyInput = document.getElementById('apiKey');
    const rememberInput = document.getElementById('remember');
    const submitBtn = document.getElementById('submitBtn');
    const statusEl = document.getElementById('status');
    const forgetBtn = document.getElementById('forget');

    function setStatus(msg, kind) {
      statusEl.textContent = msg;
      statusEl.className = kind || '';
    }

    async function login(apiKey, { silent } = {}) {
      submitBtn.disabled = true;
      if (!silent) setStatus('Logging in…');
      try {
        const res = await fetch('/admin/token', { method: 'POST', headers: { 'X-Api-Key': apiKey } });
        if (!res.ok) throw new Error(res.status === 401 ? 'Invalid API key' : res.status === 503 ? 'FISHBOT_API_KEY is not set on the server' : `Failed (${res.status})`);
        const data = await res.json();
        localStorage.setItem('fishbot_token', data.token);
        localStorage.setItem('fishbot_user', JSON.stringify({
          id: data.user_id, username: data.username, display_name: data.username,
        }));
        if (rememberInput.checked) {
          localStorage.setItem(KEY_STORAGE, apiKey);
        } else {
          localStorage.removeItem(KEY_STORAGE);
        }
        setStatus('Logged in — redirecting…', 'ok');
        window.location.href = '/app/';
      } catch (err) {
        submitBtn.disabled = false;
        setStatus(err.message, 'error');
      }
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      login(apiKeyInput.value.trim());
    });

    forgetBtn.addEventListener('click', () => {
      localStorage.removeItem(KEY_STORAGE);
      forgetBtn.style.display = 'none';
      setStatus('Saved key cleared on this device.', 'ok');
    });

    // A remembered key on this device re-logs-in with zero typing — this is
    // what makes repeat testing painless without a standing open bypass:
    // the secret still has to have been entered once, on this device.
    const saved = localStorage.getItem(KEY_STORAGE);
    if (saved) {
      forgetBtn.style.display = 'block';
      apiKeyInput.value = saved;
      login(saved, { silent: true });
    }
  </script>
</body>
</html>
