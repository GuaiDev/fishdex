# FishDex API on Fly.io. First deploy steps are in deploy/README.md.
# Change `app` if the name is taken (and set FISHDEX_API_URL on Vercel to match).
app = "fishdex-api-jason"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  # The Vercel address of the app. Comma-separate to allow more than one.
  FISHBOT_CORS_ORIGINS = "https://fishdex-red.vercel.app"

[mounts]
  source = "fishdex_data"
  destination = "/data"
  initial_size = "3gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 25

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
