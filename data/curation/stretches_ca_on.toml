# Fishing stretches — Ontario. Level 1 of the explore map.
#
# This file is the authority on which stretches the map shows. `make
# build-stretches` reads it, traces every [[stretch]] through the Ontario Hydro
# Network, and replaces the stored set. No code change is needed for any edit:
#
#   rename  change `name` (keep `id` — it is the stable key the map and later
#           anchors/pins refer to; change it only if the stretch is new water).
#   add     append a [[stretch]]. The build prints the largest clustered
#           candidates that no stretch covers, already in this format.
#   drop    delete the entry, or set `enabled = false` to keep it on file.
#   merge   give one stretch several [[stretch.reach]] tables.
#   split   two entries whose reaches share a boundary point.
#
# Each reach runs `from` one point `to` another, optionally through `via`
# points that pin the route where channels connect more than one way. A point
# snaps to the largest channel within 150 m of the nearest one (and never more
# than `max_snap_m`, default 400 m, away). Where that picks the wrong channel,
# add `ogf_id = <OHN segment id>` to the point to pin it.
#
# Overrides per stretch: `include_ogf_ids` / `exclude_ogf_ids` add or remove
# individual OHN segments after tracing. A segment belongs to at most one
# stretch; if two claim it, the earlier entry in this file keeps it and the
# build reports the conflict.
#
# `notes` records where the clustering or snapping needed a human — read it
# before moving a point.
#
# First Nations territory: no boundary layer exists in this repository, so it
# is handled here, by leaving those waters out. The Grand between Brantford and
# Caledonia (Six Nations of the Grand River, Mississaugas of the Credit), the
# Thames between Delaware and Thamesville (Chippewas of the Thames,
# Munsee-Delaware, Oneida Nation of the Thames, Delaware Nation at
# Moraviantown) and the St. Clair delta (Walpole Island First Nation) have no
# stretch on purpose.

version = 1
jurisdiction = "CA-ON"
# (min_lon, min_lat, max_lon, max_lat) — the network fetched for the build:
# southern Ontario to the French River latitude, Windsor to Ottawa.
build_bbox = [-83.5, 41.5, -75.5, 45.5]

