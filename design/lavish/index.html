<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>FishDex — clickable prototype</title>
<style>
  :root {
    color-scheme: light;
    --label: #1D1D1F; --label-2: #6E6E73; --bg: #F5F5F7; --bg-solid: #FFFFFF;
    --glass: rgba(251,251,253,.72); --separator: rgba(60,60,67,.29);
    --fill: rgba(120,120,128,.16); --blue: #007AFF; --nav-h: 52px; --tab-h: 56px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --label: #F5F5F7; --label-2: #A1A1A6; --bg: #000000; --bg-solid: #1C1C1E;
      --glass: rgba(29,29,31,.72); --separator: rgba(84,84,88,.6);
      --fill: rgba(120,120,128,.32); --blue: #0A84FF;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--label);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px; -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  /* Glass lives on the navigation chrome only. */
  .glass { background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); }

  header.nav {
    position: fixed; inset: 0 0 auto 0; height: var(--nav-h); z-index: 10;
    display: flex; align-items: center; gap: 16px; padding: 0 20px;
    border-bottom: .5px solid var(--separator);
  }
  .brand { font-weight: 600; font-size: 17px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .brand .mark { color: var(--blue); }
  .brand small { font-weight: 400; color: var(--label-2); font-size: 12px; }

  /* Segmented control (top, wide screens). */
  .seg { display: flex; gap: 2px; padding: 2px; background: var(--fill); border-radius: 9px; margin: 0 auto; }
  .seg a { padding: 6px 14px; border-radius: 7px; color: var(--label); text-decoration: none; font-weight: 500; font-size: 13px; white-space: nowrap; }
  .seg a[aria-current="page"] { background: var(--bg-solid); box-shadow: 0 1px 3px rgba(0,0,0,.18), 0 0 0 .5px rgba(0,0,0,.04); }
  .nav-end { width: 190px; text-align: right; color: var(--label-2); font-size: 12px; }

  @media (max-width: 1000px) { .nav-end { display: none; } }

  /* Secondary row: map variants. */
  .sub {
    position: fixed; top: var(--nav-h); left: 0; right: 0; height: 40px; z-index: 9;
    display: none; align-items: center; justify-content: center; gap: 2px;
    border-bottom: .5px solid var(--separator);
  }
  body.has-sub .sub { display: flex; }
  .sub a { padding: 4px 12px; border-radius: 999px; color: var(--label-2); text-decoration: none; font-size: 12.5px; font-weight: 500; }
  .sub a[aria-current="page"] { background: var(--blue); color: #fff; }

  main { position: fixed; inset: var(--nav-h) 0 0 0; }
  body.has-sub main { top: calc(var(--nav-h) + 40px); }
  main iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg-solid); visibility: hidden; }
  main iframe.on { visibility: visible; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--label-2); pointer-events: none; transition: opacity .2s; }
  .loading.done { opacity: 0; }
  .spin { width: 22px; height: 22px; border: 2.5px solid var(--fill); border-top-color: var(--blue); border-radius: 50%; animation: s .8s linear infinite; margin: 0 auto 10px; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } .loading { transition: none; } }

  /* Tab bar (phones). */
  nav.tabs { display: none; }
  @media (max-width: 760px) {
    header.nav .seg, .nav-end { display: none; }
    header.nav { justify-content: center; }
    main, body.has-sub main { bottom: calc(var(--tab-h) + env(safe-area-inset-bottom)); }
    nav.tabs {
      position: fixed; inset: auto 0 0 0; z-index: 10; display: flex;
      height: calc(var(--tab-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
      border-top: .5px solid var(--separator);
    }
    nav.tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 44px; color: var(--label-2); text-decoration: none; font-size: 10px; font-weight: 500; }
    nav.tabs a[aria-current="page"] { color: var(--blue); }
    nav.tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  }
</style>
</head>
<body>
<header class="nav glass">
  <div class="brand"><span class="mark">◆</span> FishDex <small>prototype · sample data</small></div>
  <nav class="seg" id="seg" aria-label="Screens"></nav>
  <div class="nav-end">Press 1–6 to switch</div>
</header>
<div class="sub glass" id="sub" aria-label="Map versions"></div>
<main id="stage"></main>
<nav class="tabs glass" id="tabs" aria-label="Screens"></nav>

<script>
(function () {
  // One entry per screen. Each is an existing mockup, loaded once and kept alive
  // so filters, selections and map position survive a trip to another screen.
  var SCREENS = [
    { id: 'guide',   label: 'Field guide', src: 'fishdex-field-guide.html',  icon: 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5zM19 19v2H6' },
    { id: 'anglers', label: 'Anglers',     src: 'fishdex-anglers.html',      icon: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 3.6-7 8-7s8 3 8 7' },
    { id: 'binder',  label: 'Binder',      src: 'fishdex-binder.html',       icon: 'M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2V3zM9 3v18M12 8h4' },
    { id: 'map',     label: 'Map',         icon: 'M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14',
      variants: [
        { id: 'revision',    label: 'Latest',      src: 'fishdex-map-revision.html' },
        { id: 'interactive', label: 'Interactive', src: 'fishdex-map-interactive.html' },
        { id: 'first',       label: 'First pass',  src: 'fishdex-map.html' } ] },
    { id: 'me',      label: 'My FishDex',  src: 'fishdex-apple.html',        icon: 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3z' },
    { id: 'theme',   label: 'Theme',       src: 'theme-rebuild.html',        icon: 'M12 3a9 9 0 1 0 0 18c1.7 0 2-1.2 1.3-2.2-.8-1.2-.1-2.8 1.4-2.8H17a4 4 0 0 0 4-4c0-5-4-9-9-9zM7.5 11h.01M10 7.5h.01M14.5 7.5h.01' }
  ];

  var seg = document.getElementById('seg'), tabs = document.getElementById('tabs'),
      sub = document.getElementById('sub'), stage = document.getElementById('stage');
  var frames = {};

  function link(href, cls, html) { var a = document.createElement('a'); a.href = href; if (cls) a.className = cls; a.innerHTML = html; return a; }
  SCREENS.forEach(function (s) {
    var href = '#/' + s.id;
    seg.appendChild(link(href, '', s.label)).dataset.id = s.id;
    tabs.appendChild(link(href, '', '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + s.icon + '"/></svg>' + s.label)).dataset.id = s.id;
  });

  function frameFor(key, src, title) {
    if (frames[key]) return frames[key];
    var f = document.createElement('iframe'), wrap = document.createElement('div');
    f.title = title; f.src = src;
    var ld = document.createElement('div'); ld.className = 'loading';
    ld.innerHTML = '<div><div class="spin"></div>Loading ' + title + '…</div>';
    f.addEventListener('load', function () { ld.classList.add('done'); });
    stage.appendChild(f); stage.appendChild(ld);
    return (frames[key] = f);
  }

  function route() {
    var parts = (location.hash || '#/map').replace(/^#\/?/, '').split('/');
    var s = SCREENS.filter(function (x) { return x.id === parts[0]; })[0] || SCREENS[3];
    var v = s.variants && (s.variants.filter(function (x) { return x.id === parts[1]; })[0] || s.variants[0]);
    var src = v ? v.src : s.src, key = v ? s.id + '/' + v.id : s.id;

    frameFor(key, src, v ? s.label + ' — ' + v.label : s.label);
    Object.keys(frames).forEach(function (k) { frames[k].classList.toggle('on', k === key); });
    document.body.classList.toggle('has-sub', !!v);

    [seg, tabs].forEach(function (c) {
      [].forEach.call(c.children, function (a) {
        if (a.dataset.id === s.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
      });
    });
    sub.innerHTML = '';
    if (v) s.variants.forEach(function (x) {
      var a = link('#/' + s.id + '/' + x.id, '', x.label);
      if (x === v) a.setAttribute('aria-current', 'page');
      sub.appendChild(a);
    });
    document.title = 'FishDex — ' + s.label + (v ? ' (' + v.label + ')' : '');
  }

  function onKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
    var i = parseInt(e.key, 10);
    if (i >= 1 && i <= SCREENS.length) location.hash = '#/' + SCREENS[i - 1].id;
  }
  document.addEventListener('keydown', onKey);
  // Number keys also work while focus is inside a screen.
  function hookFrame(f) { try { f.contentDocument.addEventListener('keydown', onKey); } catch (e) {} }
  stage.addEventListener('load', function (e) { if (e.target.tagName === 'IFRAME') hookFrame(e.target); }, true);

  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
